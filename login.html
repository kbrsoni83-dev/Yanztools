<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>YANZ TOLS X</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
        "Segoe UI",
        Arial,
        sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#07030d;
    color:white;
}


/* =====================================================
   VIDEO BACKGROUND
===================================================== */

.video-bg{

    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-30;

    /*
       VIDEO DIBUAT LEBIH TERLIHAT
    */

    filter:
        brightness(.62)
        contrast(1.04)
        saturate(.92);
}


/* =====================================================
   TRANSPARENT PURPLE OVERLAY
===================================================== */

.video-overlay{

    position:fixed;
    inset:0;

    z-index:-29;

    pointer-events:none;

    background:

        linear-gradient(
            180deg,
            rgba(5,1,12,.18),
            rgba(12,3,24,.25),
            rgba(3,1,8,.40)
        );
}


/* =====================================================
   SOFT VIGNETTE
===================================================== */

.video-overlay::after{

    content:"";

    position:absolute;
    inset:0;

    background:

        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0,0,0,.16) 65%,
            rgba(0,0,0,.48) 100%
        );
}


/* =====================================================
   PURPLE LIGHT
===================================================== */

.purple-light{

    position:fixed;

    width:350px;
    height:350px;

    border-radius:50%;

    pointer-events:none;

    filter:blur(110px);

    z-index:-20;
}

.purple-light.one{

    left:-170px;
    top:15%;

    background:#7c3aed;

    opacity:.20;

    animation:
        purpleOne 10s
        ease-in-out
        infinite
        alternate;
}

.purple-light.two{

    right:-170px;
    bottom:-100px;

    background:#a855f7;

    opacity:.17;

    animation:
        purpleTwo 12s
        ease-in-out
        infinite
        alternate;
}

@keyframes purpleOne{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(100px,70px);
    }
}

@keyframes purpleTwo{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-80px,-70px);
    }
}


/* =====================================================
   PURPLE PARTICLES
===================================================== */

.particles{

    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:-15;

    background-image:

        radial-gradient(
            1px 1px at 8% 18%,
            rgba(220,190,255,.9),
            transparent
        ),

        radial-gradient(
            1px 1px at 18% 72%,
            rgba(190,140,255,.8),
            transparent
        ),

        radial-gradient(
            1.5px 1.5px at 32% 28%,
            rgba(255,255,255,.8),
            transparent
        ),

        radial-gradient(
            1px 1px at 44% 82%,
            rgba(210,170,255,.7),
            transparent
        ),

        radial-gradient(
            1.5px 1.5px at 58% 15%,
            rgba(255,255,255,.8),
            transparent
        ),

        radial-gradient(
            1px 1px at 71% 42%,
            rgba(200,160,255,.8),
            transparent
        ),

        radial-gradient(
            1px 1px at 84% 75%,
            rgba(255,255,255,.7),
            transparent
        ),

        radial-gradient(
            1.5px 1.5px at 94% 20%,
            rgba(215,180,255,.9),
            transparent
        );

    animation:
        starPulse 7s
        ease-in-out
        infinite
        alternate;
}

@keyframes starPulse{

    from{
        opacity:.55;
        transform:scale(1);
    }

    to{
        opacity:1;
        transform:scale(1.015);
    }
}


/* =====================================================
   FLOATING LIGHT PARTICLES
===================================================== */

.particle{

    position:fixed;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#d8b4fe;

    box-shadow:
        0 0 8px
        rgba(192,132,252,.9);

    pointer-events:none;

    z-index:-14;

    animation:
        particleUp linear infinite;
}

.p1{
    left:10%;
    bottom:-10px;
    animation-duration:12s;
}

.p2{
    left:28%;
    bottom:-20px;
    animation-duration:15s;
    animation-delay:2s;
}

.p3{
    left:48%;
    bottom:-10px;
    animation-duration:11s;
    animation-delay:4s;
}

.p4{
    left:69%;
    bottom:-20px;
    animation-duration:16s;
    animation-delay:1s;
}

.p5{
    left:86%;
    bottom:-10px;
    animation-duration:13s;
    animation-delay:3s;
}

@keyframes particleUp{

    0%{
        transform:
            translateY(0)
            translateX(0);

        opacity:0;
    }

    15%{
        opacity:.8;
    }

    70%{
        opacity:.55;
    }

    100%{
        transform:
            translateY(-110vh)
            translateX(45px);

        opacity:0;
    }
}


/* =====================================================
   MOUSE GLOW
===================================================== */

.mouse-glow{

    position:fixed;

    width:240px;
    height:240px;

    border-radius:50%;

    pointer-events:none;

    z-index:-10;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(168,85,247,.12),
            transparent 68%
        );

    filter:blur(20px);

    transition:
        left .08s linear,
        top .08s linear;
}


/* =====================================================
   WRAPPER
===================================================== */

.wrapper{

    min-height:100vh;

    width:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px;

    perspective:1400px;
}


/* =====================================================
   LOGIN GLASS
===================================================== */

.login-box{

    width:100%;
    max-width:395px;

    padding:34px 25px;

    position:relative;

    /*
       TRANSPARENT GLASS
    */

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(20,7,35,.30)
        );

    backdrop-filter:
        blur(12px)
        saturate(125%);

    -webkit-backdrop-filter:
        blur(12px)
        saturate(125%);

    border:
        1px solid
        rgba(220,185,255,.20);

    border-radius:25px;

    box-shadow:

        0 30px 90px
        rgba(0,0,0,.48),

        0 0 70px
        rgba(139,92,246,.10),

        inset 0 1px 0
        rgba(255,255,255,.13);

    animation:
        boxAppear 1s
        cubic-bezier(.2,.8,.2,1);
}


/* =====================================================
   TOP GLASS REFLECTION
===================================================== */

.login-box::before{

    content:"";

    position:absolute;

    top:0;
    left:10%;

    width:80%;
    height:1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.65),
            transparent
        );

    opacity:.55;
}


/* =====================================================
   PURPLE BORDER FLOW
===================================================== */

.login-box::after{

    content:"";

    position:absolute;

    inset:-1px;

    border-radius:26px;

    pointer-events:none;

    background:

        linear-gradient(
            120deg,
            transparent 20%,
            rgba(168,85,247,.32),
            transparent 45%,
            rgba(216,180,254,.20),
            transparent 70%
        );

    background-size:250% 250%;

    animation:
        borderFlow 7s linear infinite;

    padding:1px;

    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    mask-composite:exclude;

    -webkit-mask-composite:xor;
}

@keyframes borderFlow{

    0%{
        background-position:0% 50%;
    }

    100%{
        background-position:300% 50%;
    }
}

@keyframes boxAppear{

    0%{
        opacity:0;

        transform:
            translateY(45px)
            rotateX(10deg)
            scale(.92);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            rotateX(0)
            scale(1);
    }
}


/* =====================================================
   LOGO AREA
===================================================== */

.logo-area{

    text-align:center;

    perspective:1400px;
}


/* =====================================================
   YANZ 4D LOGO
===================================================== */

.logo{

    position:relative;

    display:inline-block;

    font-size:55px;

    font-weight:1000;

    letter-spacing:8px;

    color:#fff;

    /*
       MULTI LAYER TEXT SHADOW
       = 4D DEPTH
    */

    text-shadow:

        1px 1px 0 #c4a0ef,
        2px 2px 0 #a879d4,
        3px 3px 0 #8755b8,
        4px 4px 0 #683d8f,
        5px 5px 0 #4b286a,
        6px 6px 0 #351c4c,
        8px 8px 12px
        rgba(0,0,0,.75),

        0 0 10px
        rgba(216,180,254,.65),

        0 0 28px
        rgba(168,85,247,.42),

        0 0 55px
        rgba(124,58,237,.18);

    transform-style:preserve-3d;

    animation:

        logoFloat 4s
        ease-in-out
        infinite,

        logoGlow 3s
        ease-in-out
        infinite
        alternate;
}


/* =====================================================
   4D BACK DEPTH
===================================================== */

.logo::before{

    content:"YANZ";

    position:absolute;

    inset:0;

    z-index:-2;

    color:#43215d;

    transform:
        translate(9px,11px)
        translateZ(-20px);

    opacity:.85;

    filter:blur(.3px);

    text-shadow:

        0 0 5px
        rgba(168,85,247,.8),

        0 0 18px
        rgba(124,58,237,.5);
}


/* =====================================================
   4D EDGE / SIDE
===================================================== */

.logo::after{

    content:"YANZ";

    position:absolute;

    inset:0;

    z-index:-1;

    color:transparent;

    background:

        linear-gradient(
            145deg,
            #ffffff 0%,
            #eadcff 18%,
            #b57bea 42%,
            #ffffff 55%,
            #c084fc 72%,
            #ffffff 100%
        );

    background-size:300% 100%;

    -webkit-background-clip:text;
    background-clip:text;

    /*
       Shine layer
    */

    animation:
        logoShine 5s
        ease-in-out
        infinite;

    opacity:.55;

    pointer-events:none;
}


/* =====================================================
   LOGO FLOAT
===================================================== */

@keyframes logoFloat{

    0%,
    100%{

        transform:
            translateY(0)
            rotateX(0deg)
            rotateY(0deg);
    }

    50%{

        transform:
            translateY(-6px)
            rotateX(3deg)
            rotateY(-4deg);
    }
}


/* =====================================================
   LOGO GLOW
===================================================== */

@keyframes logoGlow{

    from{

        filter:
            brightness(.96)
            drop-shadow(
                0 0 5px
                rgba(168,85,247,.20)
            );
    }

    to{

        filter:
            brightness(1.15)
            drop-shadow(
                0 0 18px
                rgba(192,132,252,.42)
            );
    }
}


/* =====================================================
   LOGO SHINE
===================================================== */

@keyframes logoShine{

    0%{
        background-position:-200% 0;
    }

    45%,
    100%{
        background-position:200% 0;
    }
}


/* =====================================================
   TITLE
===================================================== */

.title{

    margin-top:2px;

    text-align:center;

    font-size:13px;

    font-weight:700;

    letter-spacing:8px;

    color:
        rgba(238,224,250,.90);

    text-shadow:

        0 2px 7px
        rgba(0,0,0,.8),

        0 0 15px
        rgba(168,85,247,.22);
}


/* =====================================================
   STATUS
===================================================== */

.status{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    margin-top:18px;

    color:
        rgba(230,215,240,.68);

    font-size:9px;

    font-weight:600;

    letter-spacing:2.5px;
}

.status-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#c084fc;

    box-shadow:

        0 0 6px #c084fc,

        0 0 14px
        rgba(168,85,247,.75);

    animation:
        statusPulse 2s infinite;
}

@keyframes statusPulse{

    0%,
    100%{
        transform:scale(1);
        opacity:.9;
    }

    50%{
        transform:scale(.65);
        opacity:.45;
    }
}


/* =====================================================
   FORM
===================================================== */

.form{
    margin-top:28px;
}

.label{

    display:block;

    margin-left:4px;
    margin-bottom:8px;

    font-size:9px;

    font-weight:600;

    letter-spacing:2.5px;

    color:
        rgba(225,210,238,.65);
}


/* =====================================================
   INPUT
===================================================== */

.input-box{

    width:100%;
    height:54px;

    padding:0 17px;

    border-radius:15px;

    outline:none;

    border:
        1px solid
        rgba(220,185,255,.17);

    background:
        rgba(9,3,16,.28);

    color:#fff;

    font-size:14px;

    letter-spacing:2px;

    transition:.3s ease;

    box-shadow:

        inset 0 0 20px
        rgba(0,0,0,.18);
}

.input-box::placeholder{

    color:
        rgba(225,210,240,.32);

    letter-spacing:0;
}

.input-box:focus{

    border-color:
        rgba(192,132,252,.62);

    background:
        rgba(20,7,32,.36);

    box-shadow:

        0 0 0 3px
        rgba(168,85,247,.055),

        0 0 25px
        rgba(168,85,247,.12),

        inset 0 0 20px
        rgba(0,0,0,.15);

    transform:
        translateY(-1px);
}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-btn{

    width:100%;
    height:54px;

    margin-top:18px;

    border:none;

    border-radius:15px;

    position:relative;

    overflow:hidden;

    cursor:pointer;

    color:#fff;

    font-size:13px;

    font-weight:800;

    letter-spacing:3px;

    background:

        linear-gradient(
            135deg,
            #4c1d72,
            #6d28a0,
            #8b4cc1,
            #5b2582
        );

    background-size:250% 250%;

    box-shadow:

        0 8px 25px
        rgba(0,0,0,.35),

        0 0 22px
        rgba(168,85,247,.13),

        inset 0 1px 0
        rgba(255,255,255,.20),

        inset 0 -1px 0
        rgba(0,0,0,.28);

    transition:.3s ease;

    animation:
        buttonPurple 7s
        ease infinite;
}

@keyframes buttonPurple{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}


/* BUTTON SHINE */

.login-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-130%;

    width:75%;
    height:100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.20),
            transparent
        );

    transform:
        skewX(-20deg);

    animation:
        buttonShine 4s infinite;
}

@keyframes buttonShine{

    0%{
        left:-130%;
    }

    40%,
    100%{
        left:145%;
    }
}

.login-btn:hover{

    transform:
        translateY(-2px);

    background:

        linear-gradient(
            135deg,
            #5b2383,
            #7c35aa,
            #a15bd0
        );

    box-shadow:

        0 12px 30px
        rgba(0,0,0,.40),

        0 0 30px
        rgba(168,85,247,.22),

        inset 0 1px 0
        rgba(255,255,255,.24);
}

.login-btn:active{

    transform:
        translateY(0)
        scale(.98);
}

.login-btn:disabled{

    opacity:.62;

    cursor:not-allowed;

    transform:none;
}


/* =====================================================
   ERROR
===================================================== */

.error{

    display:none;

    margin-top:14px;

    padding:11px;

    text-align:center;

    border-radius:11px;

    color:#ff9cbd;

    font-size:11px;

    font-weight:600;

    background:
        rgba(120,20,55,.13);

    border:
        1px solid
        rgba(255,130,180,.16);

    animation:
        shake .3s;
}

@keyframes shake{

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-5px);
    }

    50%{
        transform:translateX(5px);
    }

    75%{
        transform:translateX(-4px);
    }

    100%{
        transform:translateX(0);
    }
}


/* =====================================================
   LOADING
===================================================== */

.loading{

    display:none;

    align-items:center;

    justify-content:center;

    gap:9px;
}

.loader{

    width:15px;
    height:15px;

    border-radius:50%;

    border:
        2px solid
        rgba(230,210,245,.18);

    border-top-color:
        #d8b4fe;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    margin-top:24px;

    text-align:center;

    color:
        rgba(215,200,228,.30);

    font-size:9px;

    letter-spacing:1.8px;
}

.footer span{

    color:#d8b4fe;

    text-shadow:

        0 0 9px
        rgba(192,132,252,.35);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:400px){

    .login-box{

        padding:
            30px 20px;

        border-radius:22px;
    }

    .logo{

        font-size:46px;

        letter-spacing:6px;
    }

    .title{

        font-size:11px;

        letter-spacing:6px;
    }
}


/* =====================================================
   REDUCE MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     VIDEO
===================================================== -->

<video
    class="video-bg"
    autoplay
    muted
    loop
    playsinline>

    <source
        src="YANZ.mp4"
        type="video/mp4">

</video>


<!-- OVERLAY -->

<div class="video-overlay"></div>


<!-- LIGHT -->

<div class="purple-light one"></div>
<div class="purple-light two"></div>


<!-- STARS -->

<div class="particles"></div>


<!-- FLOATING PARTICLES -->

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>


<!-- MOUSE -->

<div
    class="mouse-glow"
    id="mouseGlow">
</div>


<!-- =====================================================
     LOGIN
===================================================== -->

<div class="wrapper">

    <div class="login-box">


        <!-- LOGO -->

        <div class="logo-area">

            <div
                class="logo"
                data-text="YANZ">

                YANZ

            </div>

            <div class="title">
                TOLS X
            </div>

        </div>


        <!-- STATUS -->

        <div class="status">

            <span class="status-dot"></span>

            SYSTEM ONLINE

        </div>


        <!-- FORM -->

        <div class="form">

            <label class="label">
                ACCESS KEY
            </label>


            <input
                type="password"
                id="key"
                class="input-box"
                placeholder="Masukkan key..."
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
            >


            <button
                class="login-btn"
                id="loginButton"
                onclick="login()">

                <span id="buttonText">
                    LOGIN
                </span>

                <span
                    class="loading"
                    id="loading">

                    <span class="loader"></span>

                    CHECKING...

                </span>

            </button>


            <div
                class="error"
                id="error">

                ACCESS KEY SALAH ❌

            </div>

        </div>


        <!-- FOOTER -->

        <div class="footer">

            © 2026

            <span>
                YANZ PROJECT
            </span>

        </div>


    </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const LOGIN_KEY = "PUKY";


/* =====================================================
   ELEMENTS
===================================================== */

const keyInput =
    document.getElementById("key");

const errorBox =
    document.getElementById("error");

const loginButton =
    document.getElementById("loginButton");

const buttonText =
    document.getElementById("buttonText");

const loading =
    document.getElementById("loading");

const mouseGlow =
    document.getElementById("mouseGlow");


/* =====================================================
   MOUSE GLOW
===================================================== */

document.addEventListener(
    "mousemove",
    function(event){

        mouseGlow.style.left =
            event.clientX + "px";

        mouseGlow.style.top =
            event.clientY + "px";

    }
);


/* =====================================================
   TOUCH GLOW
===================================================== */

document.addEventListener(
    "touchmove",
    function(event){

        if(!event.touches.length)
            return;

        const touch =
            event.touches[0];

        mouseGlow.style.left =
            touch.clientX + "px";

        mouseGlow.style.top =
            touch.clientY + "px";

    },
    {passive:true}
);


/* =====================================================
   LOGIN
===================================================== */

function login(){

    const key =
        keyInput.value.trim();

    errorBox.style.display =
        "none";


    if(key === ""){

        showError(
            "Masukkan access key!"
        );

        keyInput.focus();

        return;
    }


    loginButton.disabled =
        true;

    buttonText.style.display =
        "none";

    loading.style.display =
        "flex";


    setTimeout(
        function(){

            if(key === LOGIN_KEY){

                sessionStorage.setItem(
                    "yanzLogin",
                    "true"
                );

                sessionStorage.setItem(
                    "yanzLoginTime",
                    Date.now()
                );

                window.location.href =
                    "utama.html";

            }

            else{

                loginButton.disabled =
                    false;

                buttonText.style.display =
                    "inline";

                loading.style.display =
                    "none";

                showError(
                    "ACCESS KEY SALAH ❌"
                );

                keyInput.select();

            }

        },
        800
    );
}


/* =====================================================
   ERROR
===================================================== */

function showError(message){

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

    errorBox.style.animation =
        "none";

    void errorBox.offsetWidth;

    errorBox.style.animation =
        "shake .3s";
}
