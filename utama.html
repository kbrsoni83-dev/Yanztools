<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>YANZ PROJECT</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    background:#08050d;

    color:#fff;

    overflow-x:hidden;
}


/* =====================================================
   VARIABLES
===================================================== */

:root{

    --purple:#7c3aed;
    --purple2:#a855f7;
    --purple3:#c084fc;

    --white:#ffffff;

    --muted:#c8bfd2;

    --glass:
        rgba(15,8,25,.30);

    --glass-light:
        rgba(35,18,52,.25);

    --border:
        rgba(220,180,255,.18);
}


/* =====================================================
   BACKGROUND VIDEO
===================================================== */

#bgVideo{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-50;

    /*
       Video tetap jelas.
    */

    filter:
        brightness(.68)
        contrast(1.02)
        saturate(.92);
}


/* =====================================================
   VIDEO OVERLAY
===================================================== */

.bg-overlay{

    position:fixed;

    inset:0;

    z-index:-49;

    pointer-events:none;

    background:

        linear-gradient(
            180deg,
            rgba(5,2,10,.16),
            rgba(8,3,15,.24),
            rgba(5,2,10,.30)
        );
}


/* =====================================================
   PURPLE LIGHT
===================================================== */

.bg-purple{

    position:fixed;

    width:420px;
    height:420px;

    border-radius:50%;

    pointer-events:none;

    z-index:-45;

    filter:blur(125px);

    opacity:.17;
}

.bg-purple.one{

    top:-190px;
    left:-180px;

    background:#8b5cf6;

    animation:
        purpleFloatOne
        12s
        ease-in-out
        infinite
        alternate;
}

.bg-purple.two{

    right:-190px;
    bottom:-190px;

    background:#6d28d9;

    animation:
        purpleFloatTwo
        14s
        ease-in-out
        infinite
        alternate;
}

@keyframes purpleFloatOne{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(90px,70px);
    }
}

@keyframes purpleFloatTwo{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-90px,-70px);
    }
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{

    position:sticky;

    top:0;

    z-index:100;

    width:100%;

    padding:
        13px 5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
        rgba(8,4,14,.30);

    border-bottom:
        1px solid
        rgba(220,180,255,.12);

    backdrop-filter:
        blur(17px)
        saturate(125%);

    -webkit-backdrop-filter:
        blur(17px)
        saturate(125%);
}


/* =====================================================
   BRAND
===================================================== */

.brand{

    display:flex;

    align-items:center;

    gap:11px;

    cursor:pointer;
}


/* =====================================================
   YZ LOGO
===================================================== */

.logo{

    width:43px;
    height:43px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    color:#fff;

    font-size:14px;

    font-weight:900;

    letter-spacing:1px;

    background:

        linear-gradient(
            145deg,
            rgba(168,85,247,.27),
            rgba(76,29,149,.16)
        );

    border:
        1px solid
        rgba(220,180,255,.30);

    box-shadow:

        0 0 25px
        rgba(124,58,237,.14),

        inset 0 1px 0
        rgba(255,255,255,.13);

    backdrop-filter:
        blur(10px);
}


.brand-name{

    font-size:15px;

    font-weight:900;

    letter-spacing:2px;
}

.brand-name span{

    color:#c084fc;

    text-shadow:
        0 0 15px
        rgba(192,132,252,.25);
}


/* =====================================================
   DESKTOP NAV
===================================================== */

.nav{

    display:flex;

    align-items:center;

    gap:3px;
}

.nav a{

    color:#ddd4e5;

    text-decoration:none;

    font-size:10px;

    font-weight:700;

    letter-spacing:.5px;

    padding:
        10px 12px;

    border-radius:9px;

    transition:.25s;
}

.nav a:hover,
.nav a.active{

    color:#fff;

    background:
        rgba(139,92,246,.15);

    box-shadow:
        0 0 18px
        rgba(124,58,237,.06);
}


/* =====================================================
   ONLINE
===================================================== */

.online{

    display:flex;

    align-items:center;

    gap:7px;

    color:#d0c5d9;

    font-size:9px;

    font-weight:800;

    letter-spacing:1px;
}

.online-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#55e69a;

    box-shadow:
        0 0 10px #55e69a;
}


/* =====================================================
   MOBILE BUTTON
===================================================== */

.menu-btn{

    display:none;

    width:43px;
    height:43px;

    border-radius:13px;

    border:
        1px solid
        rgba(220,180,255,.24);

    background:
        rgba(124,58,237,.12);

    color:#fff;

    cursor:pointer;

    backdrop-filter:
        blur(12px);

    transition:.2s;
}

.menu-btn svg{

    width:21px;
    height:21px;
}

.menu-btn:active{

    transform:scale(.94);
}


/* =====================================================
   MOBILE MENU
===================================================== */

.mobile-menu{

    display:none;

    position:fixed;

    top:72px;

    left:5%;
    right:5%;

    padding:8px;

    background:
        rgba(13,7,22,.74);

    border:
        1px solid
        rgba(205,157,255,.20);

    border-radius:17px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.35);

    backdrop-filter:
        blur(22px);

    z-index:99;
}

.mobile-menu a{

    display:block;

    color:#ddd4e5;

    text-decoration:none;

    padding:14px;

    font-size:11px;

    font-weight:800;

    letter-spacing:.4px;

    border-radius:10px;
}

.mobile-menu a:hover{

    color:#fff;

    background:
        rgba(139,92,246,.14);
}


/* =====================================================
   MAIN
===================================================== */

.main{

    width:100%;

    max-width:1050px;

    margin:auto;

    padding:
        50px 5%
        75px;
}


/* =====================================================
   HOME
===================================================== */

.home{

    padding:
        18px 0
        20px;
}

.home-label{

    color:#d19aff;

    font-size:10px;

    font-weight:900;

    letter-spacing:3px;

    margin-bottom:12px;

    text-shadow:
        0 0 15px
        rgba(190,120,255,.35);
}

.home h1{

    font-size:
        clamp(38px,7vw,65px);

    line-height:1;

    letter-spacing:-3px;

    font-weight:900;

    text-shadow:
        0 8px 35px
        rgba(0,0,0,.35);
}

.home h1 span{

    color:#d09aff;

    text-shadow:
        0 0 28px
        rgba(168,85,247,.35);
}

.home-line{

    width:55px;

    height:3px;

    margin-top:19px;

    border-radius:20px;

    background:

        linear-gradient(
            90deg,
            #7c3aed,
            #d8b4fe
        );

    box-shadow:
        0 0 18px
        rgba(168,85,247,.45);
}


/* =====================================================
   MUSIC PLAYER
===================================================== */

.music{

    margin-top:20px;

    width:100%;

    padding:18px;

    border-radius:20px;

    background:
        rgba(13,8,22,.30);

    border:
        1px solid
        rgba(221,186,255,.18);

    box-shadow:

        0 18px 45px
        rgba(0,0,0,.18),

        inset 0 0 30px
        rgba(168,85,247,.025);

    backdrop-filter:
        blur(12px)
        saturate(120%);

    -webkit-backdrop-filter:
        blur(12px)
        saturate(120%);
}

.music-top{

    display:flex;

    align-items:center;

    gap:14px;
}


/* =====================================================
   MUSIC COVER
===================================================== */

.music-cover{

    width:56px;
    height:56px;

    flex-shrink:0;

    border-radius:14px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:

        linear-gradient(
            145deg,
            rgba(168,85,247,.78),
            rgba(76,29,149,.72)
        );

    border:
        1px solid
        rgba(235,215,255,.28);

    box-shadow:

        0 8px 25px
        rgba(100,40,180,.20),

        inset 0 1px 0
        rgba(255,255,255,.18);
}


/* SVG MUSIC ICON */

.music-cover svg{

    width:28px;
    height:28px;

    fill:none;

    stroke:#fff;

    stroke-width:1.7;

    stroke-linecap:round;

    stroke-linejoin:round;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,255,255,.28)
        );
}


/* =====================================================
   MUSIC INFO
===================================================== */

.music-info{

    flex:1;

    min-width:0;
}

.music-title{

    color:#fff;

    font-size:14px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.music-artist{

    margin-top:5px;

    color:#c8bfd2;

    font-size:9px;

    letter-spacing:.5px;
}


/* =====================================================
   MUSIC BUTTON
===================================================== */

.music-play{

    width:43px;
    height:43px;

    flex-shrink:0;

    border:0;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.94);

    color:#170b24;

    cursor:pointer;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.25);

    transition:.2s;
}

.music-play svg{

    width:17px;
    height:17px;

    fill:currentColor;
}

.music-play:hover{

    transform:scale(1.06);

    box-shadow:
        0 0 22px
        rgba(210,170,255,.35);
}

.music-play:active{

    transform:scale(.94);
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-area{

    margin-top:17px;
}

.progress{

    width:100%;

    height:4px;

    background:
        rgba(255,255,255,.16);

    border-radius:10px;

    overflow:hidden;

    cursor:pointer;
}

.progress-fill{

    width:0%;

    height:100%;

    border-radius:10px;

    background:

        linear-gradient(
            90deg,
            #7c3aed,
            #d8b4fe
        );

    box-shadow:
        0 0 10px
        rgba(168,85,247,.45);

    transition:
        width .08s linear;
}

.time{

    display:flex;

    justify-content:space-between;

    margin-top:7px;

    color:#c8bfd2;

    font-size:8px;
}


/* =====================================================
   MENU SECTION
===================================================== */

.menu-section{

    margin-top:48px;
}

.section-title{

    font-size:10px;

    font-weight:900;

    letter-spacing:2.5px;

    color:#e9e0f0;

    margin-bottom:14px;
}


/* =====================================================
   MENU GRID
===================================================== */

.menu-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;
}


/* =====================================================
   MENU CARD
===================================================== */

.menu-card{

    position:relative;

    min-height:155px;

    width:100%;

    padding:18px;

    border-radius:18px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    cursor:pointer;

    overflow:hidden;

    background:

        linear-gradient(
            145deg,
            rgba(28,15,42,.38),
            rgba(10,5,17,.25)
        );

    border:
        1px solid
        rgba(215,175,255,.17);

    box-shadow:

        0 12px 35px
        rgba(0,0,0,.16),

        inset 0 1px 0
        rgba(255,255,255,.07);

    backdrop-filter:
        blur(10px)
        saturate(125%);

    -webkit-backdrop-filter:
        blur(10px)
        saturate(125%);

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}


/* TOP GLASS LINE */

.menu-card::before{

    content:"";

    position:absolute;

    top:0;
    left:15%;

    width:70%;

    height:1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    opacity:.5;
}


/* PURPLE GLOW */

.menu-card::after{

    content:"";

    position:absolute;

    width:130px;
    height:130px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(168,85,247,.08);

    filter:blur(35px);

    pointer-events:none;
}


/* HOVER */

.menu-card:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(218,181,255,.36);

    background:

        linear-gradient(
            145deg,
            rgba(42,22,62,.48),
            rgba(15,8,24,.30)
        );

    box-shadow:

        0 18px 45px
        rgba(0,0,0,.25),

        0 0 30px
        rgba(124,58,237,.10),

        inset 0 1px 0
        rgba(255,255,255,.10);
}

.menu-card:active{

    transform:
        translateY(-1px)
        scale(.98);
}


/* =====================================================
   MENU ICON
===================================================== */

.menu-icon{

    width:64px;
    height:64px;

    margin-bottom:14px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:17px;

    background:

        linear-gradient(
            145deg,
            rgba(139,92,246,.22),
            rgba(76,29,149,.12)
        );

    border:
        1px solid
        rgba(220,180,255,.23);

    box-shadow:

        0 8px 25px
        rgba(100,40,180,.12),

        inset 0 1px 0
        rgba(255,255,255,.09);

    position:relative;

    z-index:2;
}


/* SVG MENU ICONS */

.menu-icon svg{

    width:31px;
    height:31px;

    fill:none;

    stroke:#d8b4fe;

    stroke-width:1.7;

    stroke-linecap:round;

    stroke-linejoin:round;

    filter:

        drop-shadow(
            0 0 7px
            rgba(192,132,252,.35)
        );

    transition:.25s;
}

.menu-card:hover .menu-icon svg{

    stroke:#fff;

    transform:
        scale(1.08);

    filter:

        drop-shadow(
            0 0 12px
            rgba(216,180,254,.55)
        );
}


/* =====================================================
   MENU TITLE
===================================================== */

.menu-card h3{

    position:relative;

    z-index:2;

    color:#fff;

    font-size:11px;

    font-weight:900;

    letter-spacing:.7px;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,.35);
}


/* =====================================================
   FOOTER
===================================================== */

footer{

    padding:
        28px 5%;

    text-align:center;

    border-top:
        1px solid
        rgba(210,170,255,.09);

    background:
        rgba(7,4,12,.18);

    color:#a99db3;

    font-size:8px;

    letter-spacing:1.5px;

    backdrop-filter:
        blur(8px);
}


/* =====================================================
   TOAST
===================================================== */

.toast{

    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,100px);

    opacity:0;

    padding:
        11px 17px;

    border-radius:12px;

    background:
        rgba(20,10,31,.78);

    border:
        1px solid
        rgba(205,157,255,.22);

    color:#fff;

    font-size:10px;

    font-weight:700;

    transition:.3s;

    z-index:500;

    pointer-events:none;

    backdrop-filter:
        blur(15px);
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:850px){

    .nav,
    .online{

        display:none;
    }

    .menu-btn{

        display:flex;

        align-items:center;
        justify-content:center;
    }

    .menu-grid{

        grid-template-columns:
            repeat(2,1fr);
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:520px){

    .main{

        padding:
            38px 5%
            65px;
    }

    .home h1{

        font-size:45px;

        letter-spacing:-2.5px;
    }

    .music{

        padding:16px;
    }

    .menu-grid{

        gap:9px;
    }

    .menu-card{

        min-height:145px;

        padding:14px;
    }

    .menu-icon{

        width:58px;
        height:58px;

        margin-bottom:12px;
    }

    .menu-icon svg{

        width:28px;
        height:28px;
    }

}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media(max-width:350px){

    .brand-name{

        font-size:13px;
    }

    .menu-card{

        min-height:135px;
    }

    .menu-icon{

        width:53px;
        height:53px;
    }

    .menu-card h3{

        font-size:10px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<video
    id="bgVideo"
    autoplay
    muted
    loop
    playsinline>

    <source
        src="YANZ.mp4"
        type="video/mp4">

</video>


<div class="bg-overlay"></div>

<div class="bg-purple one"></div>
<div class="bg-purple two"></div>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="navbar">


    <div
        class="brand"
        onclick="go('HOME')">

        <div class="logo">
            YZ
        </div>

        <div class="brand-name">
            YANZ <span>PROJECT</span>
        </div>

    </div>


    <nav class="nav">

        <a
            href="#"
            class="active"
            onclick="go('HOME');return false;">
            HOME
        </a>

        <a
            href="#"
            onclick="go('GETKEY');return false;">
            GET KEY
        </a>

        <a
            href="#"
            onclick="go('ADMINKEY');return false;">
            ADMIN KEY
        </a>

        <a
            href="#"
            onclick="go('ADMINCONTROL');return false;">
            ADMIN CONTROL
        </a>

        <a
            href="#"
            onclick="go('FEEDBACK');return false;">
            FEEDBACK
        </a>

    </nav>


    <div class="online">

        <span class="online-dot"></span>

        ONLINE

    </div>


    <button
        class="menu-btn"
        onclick="toggleMobile()"
        aria-label="Menu">

        <svg
            viewBox="0 0 24 24">

            <path
                d="M4 6h16M4 12h16M4 18h16"/>

        </svg>

    </button>

</header>


<!-- =====================================================
     MOBILE MENU
===================================================== -->

<div
    class="mobile-menu"
    id="mobileMenu">

    <a
        href="#"
        onclick="go('HOME');closeMobile();return false;">
        HOME
    </a>

    <a
        href="#"
        onclick="go('GETKEY');closeMobile();return false;">
        GET KEY
    </a>

    <a
        href="#"
        onclick="go('ADMINKEY');closeMobile();return false;">
        ADMIN KEY
    </a>

    <a
        href="#"
        onclick="go('ADMINCONTROL');closeMobile();return false;">
        ADMIN CONTROL
    </a>

    <a
        href="#"
        onclick="go('FEEDBACK');closeMobile();return false;">
        FEEDBACK
    </a>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <!-- =================================================
         HOME
    ================================================== -->

    <section
        class="home"
        id="home">

        <div class="home-label">
            YANZ PROJECT
        </div>

        <h1>

            Welcome to
            <span>YANZ.</span>

        </h1>

        <div class="home-line"></div>

    </section>


    <!-- =================================================
         MUSIC
    ================================================== -->

    <section class="music">


        <div class="music-top">


            <!-- MUSIC COVER -->

            <div class="music-cover">

                <svg
                    viewBox="0 0 24 24">

                    <path
                        d="M9 18V5l10-2v13"/>

                    <circle
                        cx="6"
                        cy="18"
                        r="3"/>

                    <circle
                        cx="16"
                        cy="16"
                        r="3"/>

                </svg>

            </div>


            <!-- MUSIC INFO -->

            <div class="music-info">

                <div class="music-title">
                    Bukan Superstar
                </div>

                <div class="music-artist">
                    YANZ MUSIC
                </div>

            </div>


            <!-- PLAY -->

            <button
                class="music-play"
                id="playBtn"
                onclick="toggleMusic()"
                aria-label="Play music">

                <svg
                    id="playIcon"
                    viewBox="0 0 24 24">

                    <path
                        d="M8 5v14l11-7z"/>

                </svg>

            </button>


        </div>


        <!-- PROGRESS -->

        <div class="progress-area">

            <div
                class="progress"
                id="progress">

                <div
                    class="progress-fill"
                    id="progressFill">
                </div>

            </div>


            <div class="time">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


    </section>


    <!-- =================================================
         MENU
    ================================================== -->

    <section class="menu-section">


        <div class="section-title">
            MENU
        </div>


        <div class="menu-grid">


            <!-- =========================================
                 GET KEY
            ========================================== -->

            <div
                class="menu-card"
                onclick="go('GETKEY')">

                <div class="menu-icon">

                    <svg
                        viewBox="0 0 24 24">

                        <circle
                            cx="8"
                            cy="15"
                            r="4"/>

                        <path

<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="music"
    preload="metadata">

    <source
        src="YANZ.mp3"
        type="audio/mpeg">

</audio>


<!-- =====================================================
     TOAST
===================================================== -->

<div
    class="toast"
    id="toast">
</div>


<script>

/* =====================================================
   LINKS
===================================================== */

const LINKS = {

    HOME:
        "utama.html",

    GETKEY:
        "key.html",

    ADMINKEY:
        "admin-key.html",

    ADMINCONTROL:
        "admin-control.html",

    FEEDBACK:
        "feedback.html"

};


/* =====================================================
   NAVIGATION
===================================================== */

function go(menu){

    if(menu === "HOME"){

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

        return;
    }


    if(LINKS[menu]){

        window.location.href =
            LINKS[menu];

        return;
    }


    showToast(
        "Menu belum tersedia"
    );

}


/* =====================================================
   MOBILE MENU
===================================================== */

function toggleMobile(){

    const menu =
        document.getElementById(
            "mobileMenu"
        );

    menu.style.display =
        menu.style.display === "block"
            ? "none"
            : "block";
}


function closeMobile(){

    document.getElementById(
        "mobileMenu"
    ).style.display =
        "none";
}


/* =====================================================
   MUSIC
===================================================== */

const music =
    document.getElementById(
        "music"
    );

const playBtn =
    document.getElementById(
        "playBtn"
    );

const playIcon =
    document.getElementById(
        "playIcon"
    );

const progress =
    document.getElementById(
        "progress"
    );

const progressFill =
    document.getElementById(
        "progressFill"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );

const duration =
    document.getElementById(
        "duration"
    );


/* =====================================================
   PLAY ICON
===================================================== */

function setPlayIcon(){

    playIcon.innerHTML =

        '<path d="M8 5v14l11-7z"/>';

}


function setPauseIcon(){

    playIcon.innerHTML =

        '<path d="M7 5v14M17 5v14"/>';
}


/* =====================================================
   TOGGLE MUSIC
===================================================== */

function toggleMusic(){

    if(music.paused){

        music.play()

        .then(function(){

            setPauseIcon();

        })

        .catch(function(){

            showToast(
                "YANZ.mp3 tidak ditemukan"
            );

        });

    }

    else{

        music.pause();

        setPlayIcon();

    }

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds){

    if(!isFinite(seconds)){

        return "0:00";
    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (

        minutes +

        ":" +

        (
            secs < 10
                ? "0"
                : ""
        ) +

        secs

    );

}


/* =====================================================
   AUDIO LOADED
===================================================== */

music.addEventListener(
    "loadedmetadata",
    function(){

        duration.textContent =
            formatTime(
                music.duration
            );

    }
);


/* =====================================================
   AUDIO TIME
===================================================== */

music.addEventListener(
    "timeupdate",
    function(){

        if(!music.duration){

            return;
        }


        const percent =

            (
                music.currentTime /
                music.duration
            ) * 100;


        progressFill.style.width =
            percent + "%";


        currentTime.textContent =
            formatTime(
                music.currentTime
            );

    }
);


/* =====================================================
   PLAY EVENT
===================================================== */

music.addEventListener(
    "play",
    function(){

        setPauseIcon();

    }
);


/* =====================================================
   PAUSE EVENT
===================================================== */

music.addEventListener(
    "pause",
    function(){

        setPlayIcon();

    }
);


/* =====================================================
   ENDED
===================================================== */

music.addEventListener(
    "ended",
    function(){

        setPlayIcon();

        progressFill.style.width =
            "0%";

        currentTime.textContent =
            "0:00";

    }
);


/* =====================================================
   SEEK
===================================================== */

progress.addEventListener(
    "click",
    function(event){

        if(!music.duration){

            return;
        }


        const rect =
            progress.getBoundingClientRect();


        const percent =

            (
                event.clientX -
                rect.left
            ) / rect.width;


        music.currentTime =
            percent *
            music.duration;

    }
);


/* =====================================================
   VIDEO
===================================================== */

const video =
    document.getElementById(
        "bgVideo"
    );


video.play().catch(
    function(){

        console.log(
            "YANZ.mp4 menunggu interaksi."
        );

    }
);


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =====================================================
   CLOSE MOBILE OUTSIDE
===================================================== */

document.addEventListener(
    "click",
    function(event){

        const menu =
            document.getElementById(
                "mobileMenu"
            );

        const button =
            document.querySelector(
                ".menu-btn"
            );


        if(

            menu.style.display ===
                "block"

            &&

            !menu.contains(
                event.target
            )

            &&

            !button.contains(
                event.target
            )

        ){

            menu.style.display =
                "none";

        }

    }
);

</script>

</body>
</html>
